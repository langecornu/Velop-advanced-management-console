<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b5bf0"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- The mesh: three nodes linked to each other and to the hub in the middle -->
  <g stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity="0.55">
    <path d="M32 15 L15 46 L49 46 Z" fill="none"/>
    <path d="M32 15 L32 35 M15 46 L32 35 M49 46 L32 35"/>
  </g>
  <g fill="#fff">
    <circle cx="32" cy="15" r="6"/>
    <circle cx="15" cy="46" r="6"/>
    <circle cx="49" cy="46" r="6"/>
  </g>
  <!-- The console: a live, green hub at the center of the mesh -->
  <circle cx="32" cy="35" r="7" fill="#22c55e" stroke="#fff" stroke-width="3"/>
</svg>
